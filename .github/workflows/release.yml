name: Release

# 打 tag（v1.0.0）就出正式发布：单文件包 + 安装包，并挂在 GitHub Release 上。
# 手动触发只构建、只上传 Actions artifact，不会碰 Release，方便试打包。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0）。留空则用 0.0.0-dev.<构建号>'
        required: false

# gh release 要用写权限创建 Release 并上传附件。
permissions:
  contents: write

# 同一个 tag 连打两次时排队执行，避免两个进程同时往同一个 Release 传附件。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    env:
      # vcpkg 的二进制包缓存目录，配合下面的 actions/cache 跳过重复编译 imgui。
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        shell: pwsh
        run: |
          $requested = '${{ github.event.inputs.version }}'.Trim()
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF_NAME -replace '^[vV]', ''
          } elseif ($requested) {
            $version = $requested -replace '^[vV]', ''
          } else {
            $version = "0.0.0-dev.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "版本号不合法：'$version'，应形如 1.0.0 或 1.0.0-rc1"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "版本号：$version"

      - name: 准备 vcpkg
        shell: pwsh
        run: |
          # CMakePresets 里用 $env{VCPKG_ROOT}；GitHub 的 Windows 镜像只保证有
          # VCPKG_INSTALLATION_ROOT，所以两个都试，再写回环境变量给后续步骤。
          $root = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { $env:VCPKG_INSTALLATION_ROOT }
          if (-not $root -or -not (Test-Path "$root\vcpkg.exe")) {
            throw "找不到 vcpkg（VCPKG_ROOT / VCPKG_INSTALLATION_ROOT 都不可用）。"
          }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$root\vcpkg.exe" version

      - name: 缓存 vcpkg 二进制包
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: 配置
        shell: pwsh
        run: cmake --preset default "-DWIND_VERSION=${{ steps.version.outputs.version }}"

      - name: 构建 Release
        shell: pwsh
        run: cmake --build --preset release

      - name: 校验 exe 的版本资源
        shell: pwsh
        run: |
          $exe = 'build\Release\Wind.exe'
          if (-not (Test-Path $exe)) { throw "没有产物：$exe" }
          $info = (Get-Item $exe).VersionInfo
          $expected = '${{ steps.version.outputs.version }}'
          Write-Host "FileVersion=$($info.FileVersion) ProductName=$($info.ProductName)"
          if ($info.FileVersion -ne $expected) {
            throw "版本资源没注入成功：期望 $expected，实际 $($info.FileVersion)"
          }

      - name: 打包单文件版
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP 'wind-portable'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build\Release\Wind.exe, README.md, README.en.md $stage
          $zip = "dist\Wind-$version-portable.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "已生成 $zip（$([math]::Round((Get-Item $zip).Length / 1KB)) KB）"

      - name: 准备 Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            $env:ISCC_PATH,
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            'D:\Inno Setup 6\ISCC.exe'   # 非默认安装位置（本机就装在这里）
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host '镜像里没有 Inno Setup，用 Chocolatey 装一个。'
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup 安装失败，找不到 ISCC.exe。' }
          "ISCC=$iscc" >> $env:GITHUB_ENV
          Write-Host "使用 $iscc"

      - name: 编译安装包
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          & $env:ISCC iss\wind.iss `
            "/DAppVersion=$version" `
            "/DSourceDir=$((Resolve-Path build\Release).Path)" `
            "/DOutputDir=$((Resolve-Path dist).Path)" `
            "/DAppURL=${{ github.server_url }}/${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败，退出码 $LASTEXITCODE" }
          $setup = "dist\Wind-$version-setup.exe"
          if (-not (Test-Path $setup)) { throw "没有产物：$setup" }
          Write-Host "已生成 $setup（$([math]::Round((Get-Item $setup).Length / 1KB)) KB）"

      - name: 生成校验和
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Wind-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      # 只有 tag 才发 Release；手动触发时上面这步已经把包留在 Actions 里了。
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = '${{ steps.version.outputs.version }}'
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，覆盖附件。"
            gh release upload $tag @assets --clobber
          } else {
            $extra = @()
            if ($version.Contains('-')) { $extra += '--prerelease' }
            gh release create $tag @assets --title "Wind $version" --generate-notes @extra
          }
          if ($LASTEXITCODE -ne 0) { throw "gh 发布失败，退出码 $LASTEXITCODE" }
